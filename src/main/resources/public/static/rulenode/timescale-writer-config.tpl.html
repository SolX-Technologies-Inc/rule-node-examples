<div layout="column" class="md-padding">

    <div layout="row" layout-xs="column" layout-wrap>
        <md-input-container flex="50" flex-xs="100">
            <label>Host</label>
            <input ng-model="configuration.host" required>
        </md-input-container>

        <md-input-container flex="50" flex-xs="100">
            <label>Port</label>
            <input type="number" ng-model="configuration.port" required min="1">
        </md-input-container>
    </div>

    <div layout="row" layout-xs="column" layout-wrap>
        <md-input-container flex="33" flex-xs="100">
            <label>Database</label>
            <input ng-model="configuration.db" required>
        </md-input-container>

        <md-input-container flex="33" flex-xs="100">
            <label>Schema</label>
            <input ng-model="configuration.schema" required>
        </md-input-container>

        <md-input-container flex="34" flex-xs="100">
            <label>Table</label>
            <input ng-model="configuration.table" required>
        </md-input-container>
    </div>

    <div layout="row" layout-xs="column" layout-wrap>
        <md-input-container flex="50" flex-xs="100">
            <label>User</label>
            <input ng-model="configuration.user" required>
        </md-input-container>

        <md-input-container flex="50" flex-xs="100">
            <label>Password</label>
            <input type="password" ng-model="configuration.password" required>
        </md-input-container>
    </div>

    <md-input-container>
        <label>SSL Mode</label>
        <md-select ng-model="configuration.sslMode" aria-label="SSL Mode">
            <md-option value="disable">disable</md-option>
            <md-option value="require">require</md-option>
            <md-option value="verify-ca">verify-ca</md-option>
            <md-option value="verify-full">verify-full</md-option>
        </md-select>
    </md-input-container>

    <div class="md-caption" style="margin-top:8px;">
        JDBC URL and INSERT SQL are generated automatically by the node during init().
    </div>
</div>
